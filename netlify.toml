# Netlify build configuration.
#
# Deliberately minimal: build command, publish directory and the Next.js
# runtime all stay configured in the Netlify UI. Anything named here would
# override the dashboard, so only the setting that has to live in the repo is
# present.

[build.environment]
  # Netlify's secret scanner fails the build when the VALUE of an environment
  # variable appears anywhere under the publish directory. Marking a variable
  # "contains secret values" switches it on, and the first production deploy
  # failed on AI_KEY_ENCRYPTION_SECRET and CRON_SECRET.
  #
  # Both were real hits, but not in anything that is served. Turbopack records
  # the compilation environment in its own cache, so the values sit in
  # .next/cache/turbopack/*.sst -- an incremental-build artifact Netlify
  # restores between builds and never serves to a browser. Located precisely:
  # 15 files for AI_KEY_ENCRYPTION_SECRET and 18 for CRON_SECRET, every one of
  # them under a cache directory, and zero in the 1,109 files of real build
  # output.
  #
  # So the fix is to stop scanning the cache, NOT to stop scanning those
  # variables. Omitting the keys would have switched off the check that
  # actually protects them; omitting the path leaves it fully armed over
  # everything that ships, so a future change that genuinely inlines a secret
  # into a page or chunk still fails the build.
  #
  # Scanning stays on for every variable, including these two. If a build ever
  # fails again naming one, it will be pointing at real served output and is
  # worth taking seriously rather than silencing.
  SECRETS_SCAN_OMIT_PATHS = ".next/cache/**"
