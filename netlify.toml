# Netlify build configuration.
#
# Deliberately minimal: build command, publish directory and the Next.js
# runtime all stay configured in the Netlify UI. Anything named here would
# override the dashboard, so only the setting that has to live in the repo is
# present.

[build.environment]
  # Netlify's secret scanner fails the build when the value of an environment
  # variable appears anywhere it scans. Marking a variable "contains secret
  # values" switches it on, and it then reported AI_KEY_ENCRYPTION_SECRET and
  # CRON_SECRET. From the build log, both were found in exactly one file:
  #
  #   .netlify/.next/cache/turbopack/v16.3.3-<hash>/00000001.sst
  #
  # That is Turbopack's compilation cache. Turbopack records the build
  # environment in it, and Netlify persists it between builds -- the log says
  # so directly, "Next.js cache restored" before the build and "Next.js cache
  # saved" after. It is not served: the same log shows only
  # .netlify/functions-internal/___netlify-server-handler is packaged into the
  # deployed function.
  #
  # The path matters and cost two failed builds to get right. The cache lives
  # at .next/cache locally, but the Netlify runtime copies the build under
  # .netlify/, so on the build machine it is .netlify/.next/cache -- a pattern
  # written against the local path silently matches nothing there. Both are
  # listed so this holds whether it runs here or on Netlify.
  #
  # Omitting the PATH, not the keys. SECRETS_SCAN_OMIT_KEYS would have
  # disarmed the scanner over precisely the two credentials most worth
  # guarding, while leaving it pointed at output that was already clean.
  # Scanning stays on for every variable across everything that ships, so a
  # change that genuinely inlines a secret into a page, chunk or function
  # still fails the build.
  SECRETS_SCAN_OMIT_PATHS = ".next/cache/**,.netlify/.next/cache/**"
