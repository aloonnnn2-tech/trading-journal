name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      NEXT_PUBLIC_SUPABASE_URL: https://placeholder.supabase.co
      NEXT_PUBLIC_SUPABASE_ANON_KEY: placeholder-anon-key
      SUPABASE_SERVICE_ROLE_KEY: placeholder-service-role-key
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      # Fail on a known high/critical advisory in a PRODUCTION dependency.
      # Dependabot already opens upgrade PRs; this makes an unpatched serious
      # vuln block the build rather than sit unnoticed. Scoped to prod deps
      # (--omit=dev) so a dev-only tooling advisory doesn't red-CI a feature
      # branch, and pinned to high+ so low/moderate noise stays a Dependabot PR.
      - run: npm audit --audit-level=high --omit=dev

      - run: npx vitest run

      - run: npm run lint

      - run: npm run build

      # No server-only value may reach the browser bundle. The placeholders in
      # `env` above stand in for the real secrets: if code ever inlined one
      # into a client component, the placeholder would show up here.
      - run: npx tsx scripts/check-bundle-secrets.ts

  # Secret scan over the FULL git history on every push (security hardening,
  # Phase 3). Downloads the pinned gitleaks release binary rather than the
  # marketplace action, which needs a licence key for organisation accounts.
  # Reviewed false positives (fake keys in old test files) are listed in
  # .gitleaksignore -- add a line there only after checking a finding is fake.
  secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Install gitleaks
        run: |
          curl -sSfL -o gitleaks.tgz https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz
          tar -xzf gitleaks.tgz gitleaks

      - name: Scan history for secrets
        run: ./gitleaks git . --log-opts="--all" --redact=100 --no-banner --exit-code 1
