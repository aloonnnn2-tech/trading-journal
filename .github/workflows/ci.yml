name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      NEXT_PUBLIC_SUPABASE_URL: https://placeholder.supabase.co
      NEXT_PUBLIC_SUPABASE_ANON_KEY: placeholder-anon-key
      SUPABASE_SERVICE_ROLE_KEY: placeholder-service-role-key
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v4
        with:
          # Same version Netlify builds with (it reads .nvmrc too).
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci

      # Fail on a known high/critical advisory in a PRODUCTION dependency.
      # Dependabot already opens upgrade PRs; this makes an unpatched serious
      # vuln block the build rather than sit unnoticed. Scoped to prod deps
      # (--omit=dev) so a dev-only tooling advisory doesn't red-CI a feature
      # branch, and pinned to high+ so low/moderate noise stays a Dependabot PR.
      - run: npm audit --audit-level=high --omit=dev

      - run: npx vitest run

      # The security regression suite (tests/security/suite.ts) again, on its
      # own: it already passed inside the run above, but a failure here is a
      # red X that says "security" instead of being one line in 1,900.
      - name: Security regression tests
        run: npm run test:security

      - run: npm run lint

      # A type error used to surface only inside next build, mixed in with
      # everything else it prints. Own step, own red X.
      - run: npx tsc --noEmit

      - run: npm run build

      # No server-only value may reach the browser bundle. The placeholders in
      # `env` above stand in for the real secrets: if code ever inlined one
      # into a client component, the placeholder would show up here.
      - run: npx tsx scripts/check-bundle-secrets.ts

  # The cross-user suite (tests/idor): two real accounts on the DEV Supabase
  # project, checking neither can reach the other's rows, files or routes.
  # It needs the dev project's keys, so it runs only once these repository
  # secrets exist (Settings -> Secrets and variables -> Actions):
  #   SUPABASE_DEV_URL, SUPABASE_DEV_ANON_KEY, SUPABASE_DEV_SERVICE_ROLE_KEY
  #     -- the DEV project's values, from .env.test.local; never live's
  #   SUPABASE_PROD_URL -- live's URL (public anyway), so the guard in
  #     src/lib/env/dev-guard.ts can refuse it
  # Without them the job reports "skipped". Pull requests from forks never
  # receive secrets, so a stranger's PR can't run it against the dev project.
  cross-user:
    runs-on: ubuntu-latest
    env:
      SUPABASE_DEV_URL: ${{ secrets.SUPABASE_DEV_URL }}
      SUPABASE_DEV_ANON_KEY: ${{ secrets.SUPABASE_DEV_ANON_KEY }}
      SUPABASE_DEV_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_DEV_SERVICE_ROLE_KEY }}
      SUPABASE_PROD_URL: ${{ secrets.SUPABASE_PROD_URL }}
    steps:
      - name: Check the dev-project secrets are set
        id: gate
        run: |
          if [ -n "$SUPABASE_DEV_URL" ] && [ -n "$SUPABASE_DEV_SERVICE_ROLE_KEY" ] && [ -n "$SUPABASE_PROD_URL" ]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
          else
            echo "Dev-project secrets not set: skipping the cross-user suite."
            echo "run=false" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/checkout@v4
        if: steps.gate.outputs.run == 'true'

      - uses: actions/setup-node@v4
        if: steps.gate.outputs.run == 'true'
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci
        if: steps.gate.outputs.run == 'true'

      - name: Cross-user suite (dev project)
        if: steps.gate.outputs.run == 'true'
        run: npm run test:idor

  # Secret scan over the FULL git history on every push (security hardening,
  # Phase 3). Downloads the pinned gitleaks release binary rather than the
  # marketplace action, which needs a licence key for organisation accounts.
  # Reviewed false positives (fake keys in old test files) are listed in
  # .gitleaksignore -- add a line there only after checking a finding is fake.
  secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Install gitleaks
        run: |
          curl -sSfL -o gitleaks.tgz https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz
          # Pinned checksum (from the release's checksums.txt, verified
          # 2026-10-18): a swapped download fails here instead of running.
          echo "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb  gitleaks.tgz" | sha256sum -c -
          tar -xzf gitleaks.tgz gitleaks

      - name: Scan history for secrets
        run: ./gitleaks git . --log-opts="--all" --redact=100 --no-banner --exit-code 1
