name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      NEXT_PUBLIC_SUPABASE_URL: https://placeholder.supabase.co
      NEXT_PUBLIC_SUPABASE_ANON_KEY: placeholder-anon-key
      SUPABASE_SERVICE_ROLE_KEY: placeholder-service-role-key
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      # Fail on a known high/critical advisory in a PRODUCTION dependency.
      # Dependabot already opens upgrade PRs; this makes an unpatched serious
      # vuln block the build rather than sit unnoticed. Scoped to prod deps
      # (--omit=dev) so a dev-only tooling advisory doesn't red-CI a feature
      # branch, and pinned to high+ so low/moderate noise stays a Dependabot PR.
      - run: npm audit --audit-level=high --omit=dev

      - run: npx vitest run

      - run: npm run lint

      - run: npm run build
